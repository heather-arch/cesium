<!doctype html>
<html lang="en">
  <head>
    <!-- Use correct character set. -->
    <meta charset="utf-8" />
    <!-- Tell IE to use the latest, best version. -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- Make the application on mobile take up the full browser screen and disable user scaling. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no"
    />
    <title>Survey Data Viewer with Measurements</title>
    <script src="../Build/CesiumUnminified/Cesium.js"></script>
    <style>
      @import url(../Build/CesiumUnminified/Widgets/widgets.css);
      html,
      body,
      #cesiumContainer {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #loadingOverlay {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 20px 40px;
        border-radius: 5px;
        font-family: Arial, sans-serif;
        z-index: 1000;
      }

      #loadingOverlay.hidden {
        display: none;
      }

      #measurementToolbar {
        position: absolute;
        top: 10px;
        left: 10px;
        background: rgba(42, 42, 42, 0.95);
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        z-index: 100;
        font-family: Arial, sans-serif;
      }

      .tool-button {
        background: #4CAF50;
        color: white;
        border: none;
        padding: 10px 15px;
        margin: 5px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.3s;
      }

      .tool-button:hover {
        background: #45a049;
      }

      .tool-button.active {
        background: #ff9800;
      }

      .tool-button.clear {
        background: #f44336;
      }

      .tool-button.clear:hover {
        background: #da190b;
      }

      #resultsPanel {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(42, 42, 42, 0.95);
        padding: 15px;
        border-radius: 8px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        z-index: 100;
        min-width: 250px;
        max-height: 400px;
        overflow-y: auto;
        font-family: Arial, sans-serif;
        color: white;
      }

      .result-item {
        background: rgba(76, 175, 80, 0.2);
        padding: 10px;
        margin: 5px 0;
        border-radius: 5px;
        border-left: 3px solid #4CAF50;
      }

      .result-title {
        font-weight: bold;
        color: #4CAF50;
        margin-bottom: 5px;
      }

      .result-value {
        font-size: 14px;
        color: #fff;
      }

      #instructions {
        color: #ffd700;
        font-size: 12px;
        margin-top: 10px;
        padding: 10px;
        background: rgba(255, 215, 0, 0.1);
        border-radius: 5px;
      }

      .toolbar-title {
        color: white;
        font-weight: bold;
        margin-bottom: 10px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="loadingOverlay">Loading survey data...</div>

    <div id="measurementToolbar">
      <div class="toolbar-title">📏 Measurement Tools</div>
      <button class="tool-button" id="distanceBtn">Distance</button>
      <button class="tool-button" id="areaBtn">Area</button>
      <button class="tool-button" id="heightBtn">Height</button>
      <button class="tool-button" id="pointBtn">Coordinates</button>
      <button class="tool-button clear" id="clearBtn">Clear All</button>
      <div id="instructions">Select a tool and click on the map</div>
    </div>

    <div id="resultsPanel">
      <div class="toolbar-title">📊 Measurements</div>
      <div id="resultsList"></div>
    </div>

    <script>
      // Set your Cesium Ion access token
      Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI1YjNkM2E2Zi00NGJmLTRkMjUtOTZkNy00MjFjOWQ3N2MxNjQiLCJpZCI6MzU3ODExLCJpYXQiOjE3NjI0MjkyNjN9.k797g8NHlPMrHU1pO0_bWk_-1K3PgyWRJ_rTItxWhA0';

      // Create the Cesium Viewer
      const viewer = new Cesium.Viewer("cesiumContainer", {
        terrainProvider: Cesium.createWorldTerrain(),
        timeline: true,
        animation: true,
        baseLayerPicker: true,
        geocoder: true,
        homeButton: true,
        sceneModePicker: true,
        navigationHelpButton: true,
        fullscreenButton: true
      });

      // Measurement state
      let activeTool = null;
      let measurementPoints = [];
      let activeEntities = [];
      let measurementCount = 0;

      // Load the 3D tileset from your Ion asset
      async function loadSurveyData() {
        try {
          const tileset = await Cesium.Cesium3DTileset.fromIonAssetId(4019912);
          viewer.scene.primitives.add(tileset);

          // Fly to the tileset once it's loaded
          await viewer.zoomTo(tileset);

          // Hide loading overlay
          document.getElementById('loadingOverlay').classList.add('hidden');

          console.log('Survey data loaded successfully');
        } catch (error) {
          console.error('Error loading survey data:', error);
          document.getElementById('loadingOverlay').textContent = 'Error loading survey data: ' + error.message;
        }
      }

      // Utility functions
      function formatDistance(meters) {
        if (meters < 1000) {
          return meters.toFixed(2) + ' m';
        }
        return (meters / 1000).toFixed(2) + ' km';
      }

      function formatArea(squareMeters) {
        if (squareMeters < 10000) {
          return squareMeters.toFixed(2) + ' m²';
        }
        return (squareMeters / 10000).toFixed(2) + ' ha';
      }

      function addResult(title, value) {
        const resultsList = document.getElementById('resultsList');
        const resultItem = document.createElement('div');
        resultItem.className = 'result-item';
        resultItem.innerHTML = `
          <div class="result-title">${title}</div>
          <div class="result-value">${value}</div>
        `;
        resultsList.insertBefore(resultItem, resultsList.firstChild);
      }

      function updateInstructions(text) {
        document.getElementById('instructions').textContent = text;
      }

      function setActiveTool(tool) {
        // Deactivate all buttons
        document.querySelectorAll('.tool-button').forEach(btn => {
          btn.classList.remove('active');
        });

        // Reset measurement state
        measurementPoints = [];
        activeTool = tool;

        if (tool) {
          document.getElementById(tool + 'Btn').classList.add('active');
        }
      }

      // Distance measurement
      function measureDistance(positions) {
        if (positions.length < 2) return;

        const distance = Cesium.Cartesian3.distance(positions[0], positions[1]);

        // Draw line
        const entity = viewer.entities.add({
          polyline: {
            positions: positions,
            width: 3,
            material: Cesium.Color.YELLOW,
            clampToGround: true
          }
        });
        activeEntities.push(entity);

        // Add labels at points
        positions.forEach((pos, idx) => {
          const label = viewer.entities.add({
            position: pos,
            point: {
              pixelSize: 8,
              color: Cesium.Color.RED,
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 2
            },
            label: {
              text: idx === 0 ? 'Start' : 'End',
              font: '14px sans-serif',
              fillColor: Cesium.Color.WHITE,
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 2,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
              pixelOffset: new Cesium.Cartesian2(0, -10)
            }
          });
          activeEntities.push(label);
        });

        // Add distance label at midpoint
        const midpoint = Cesium.Cartesian3.midpoint(positions[0], positions[1], new Cesium.Cartesian3());
        const distanceLabel = viewer.entities.add({
          position: midpoint,
          label: {
            text: formatDistance(distance),
            font: '16px sans-serif',
            fillColor: Cesium.Color.YELLOW,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            pixelOffset: new Cesium.Cartesian2(0, -20),
            backgroundColor: new Cesium.Color(0, 0, 0, 0.7),
            showBackground: true,
            backgroundPadding: new Cesium.Cartesian2(7, 5)
          }
        });
        activeEntities.push(distanceLabel);

        addResult(`Distance #${++measurementCount}`, formatDistance(distance));
        setActiveTool(null);
        updateInstructions('Measurement complete. Select a tool to continue.');
      }

      // Area measurement
      function measureArea(positions) {
        if (positions.length < 3) return;

        // Close the polygon
        const closedPositions = [...positions, positions[0]];

        // Calculate area using polygon area formula
        const ellipsoid = viewer.scene.globe.ellipsoid;
        const area = calculatePolygonArea(positions, ellipsoid);

        // Draw polygon
        const entity = viewer.entities.add({
          polygon: {
            hierarchy: positions,
            material: Cesium.Color.GREEN.withAlpha(0.3),
            outline: true,
            outlineColor: Cesium.Color.GREEN,
            outlineWidth: 3
          }
        });
        activeEntities.push(entity);

        // Add markers at vertices
        positions.forEach((pos, idx) => {
          const marker = viewer.entities.add({
            position: pos,
            point: {
              pixelSize: 8,
              color: Cesium.Color.GREEN,
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 2
            }
          });
          activeEntities.push(marker);
        });

        // Add area label at center
        const center = Cesium.BoundingSphere.fromPoints(positions).center;
        const areaLabel = viewer.entities.add({
          position: center,
          label: {
            text: formatArea(area),
            font: '16px sans-serif',
            fillColor: Cesium.Color.GREEN,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            backgroundColor: new Cesium.Color(0, 0, 0, 0.7),
            showBackground: true,
            backgroundPadding: new Cesium.Cartesian2(7, 5)
          }
        });
        activeEntities.push(areaLabel);

        addResult(`Area #${++measurementCount}`, formatArea(area));
        setActiveTool(null);
        updateInstructions('Measurement complete. Select a tool to continue.');
      }

      function calculatePolygonArea(positions, ellipsoid) {
        // Convert to cartographic for area calculation
        const cartographics = positions.map(pos => ellipsoid.cartesianToCartographic(pos));

        let area = 0;
        for (let i = 0; i < cartographics.length; i++) {
          const j = (i + 1) % cartographics.length;
          area += cartographics[i].longitude * cartographics[j].latitude;
          area -= cartographics[j].longitude * cartographics[i].latitude;
        }
        area = Math.abs(area) / 2.0;

        // Convert to square meters (approximate)
        const avgLatitude = cartographics.reduce((sum, c) => sum + c.latitude, 0) / cartographics.length;
        const metersPerDegree = 111320; // at equator
        const latitudeFactor = Math.cos(avgLatitude);

        return Math.abs(area * metersPerDegree * metersPerDegree * latitudeFactor);
      }

      // Height measurement
      function measureHeight(positions) {
        if (positions.length < 2) return;

        const ellipsoid = viewer.scene.globe.ellipsoid;
        const carto1 = ellipsoid.cartesianToCartographic(positions[0]);
        const carto2 = ellipsoid.cartesianToCartographic(positions[1]);

        const heightDiff = Math.abs(carto2.height - carto1.height);

        // Draw vertical line
        const entity = viewer.entities.add({
          polyline: {
            positions: positions,
            width: 3,
            material: new Cesium.PolylineDashMaterialProperty({
              color: Cesium.Color.CYAN
            })
          }
        });
        activeEntities.push(entity);

        // Add markers
        positions.forEach((pos, idx) => {
          const carto = ellipsoid.cartesianToCartographic(pos);
          const marker = viewer.entities.add({
            position: pos,
            point: {
              pixelSize: 8,
              color: Cesium.Color.CYAN,
              outlineColor: Cesium.Color.WHITE,
              outlineWidth: 2
            },
            label: {
              text: `${carto.height.toFixed(2)} m`,
              font: '12px sans-serif',
              fillColor: Cesium.Color.WHITE,
              outlineColor: Cesium.Color.BLACK,
              outlineWidth: 2,
              style: Cesium.LabelStyle.FILL_AND_OUTLINE,
              verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
              pixelOffset: new Cesium.Cartesian2(0, -10)
            }
          });
          activeEntities.push(marker);
        });

        // Add height difference label
        const midpoint = Cesium.Cartesian3.midpoint(positions[0], positions[1], new Cesium.Cartesian3());
        const heightLabel = viewer.entities.add({
          position: midpoint,
          label: {
            text: `Δ ${heightDiff.toFixed(2)} m`,
            font: '16px sans-serif',
            fillColor: Cesium.Color.CYAN,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            backgroundColor: new Cesium.Color(0, 0, 0, 0.7),
            showBackground: true,
            backgroundPadding: new Cesium.Cartesian2(7, 5)
          }
        });
        activeEntities.push(heightLabel);

        addResult(`Height Difference #${++measurementCount}`,
          `Δ ${heightDiff.toFixed(2)} m<br>Start: ${carto1.height.toFixed(2)} m<br>End: ${carto2.height.toFixed(2)} m`);
        setActiveTool(null);
        updateInstructions('Measurement complete. Select a tool to continue.');
      }

      // Point coordinates
      function showCoordinates(position) {
        const ellipsoid = viewer.scene.globe.ellipsoid;
        const cartographic = ellipsoid.cartesianToCartographic(position);
        const longitude = Cesium.Math.toDegrees(cartographic.longitude).toFixed(6);
        const latitude = Cesium.Math.toDegrees(cartographic.latitude).toFixed(6);
        const height = cartographic.height.toFixed(2);

        const marker = viewer.entities.add({
          position: position,
          point: {
            pixelSize: 10,
            color: Cesium.Color.MAGENTA,
            outlineColor: Cesium.Color.WHITE,
            outlineWidth: 2
          },
          label: {
            text: `${latitude}°, ${longitude}°\n${height} m`,
            font: '12px sans-serif',
            fillColor: Cesium.Color.WHITE,
            outlineColor: Cesium.Color.BLACK,
            outlineWidth: 2,
            style: Cesium.LabelStyle.FILL_AND_OUTLINE,
            verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
            pixelOffset: new Cesium.Cartesian2(0, -15),
            backgroundColor: new Cesium.Color(0, 0, 0, 0.7),
            showBackground: true,
            backgroundPadding: new Cesium.Cartesian2(7, 5)
          }
        });
        activeEntities.push(marker);

        addResult(`Point #${++measurementCount}`,
          `Lat: ${latitude}°<br>Lon: ${longitude}°<br>Height: ${height} m`);
        setActiveTool(null);
        updateInstructions('Point added. Select a tool to continue.');
      }

      // Click handler
      const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
      handler.setInputAction(function(click) {
        if (!activeTool) return;

        const ray = viewer.camera.getPickRay(click.position);
        const position = viewer.scene.globe.pick(ray, viewer.scene);

        if (!Cesium.defined(position)) return;

        measurementPoints.push(position);

        if (activeTool === 'distance' && measurementPoints.length === 1) {
          updateInstructions('Click second point to measure distance');
        } else if (activeTool === 'distance' && measurementPoints.length === 2) {
          measureDistance(measurementPoints);
        } else if (activeTool === 'area' && measurementPoints.length < 3) {
          updateInstructions(`Point ${measurementPoints.length}/3 - Click ${3 - measurementPoints.length} more point(s)`);
        } else if (activeTool === 'area' && measurementPoints.length === 3) {
          measureArea(measurementPoints);
        } else if (activeTool === 'height' && measurementPoints.length === 1) {
          updateInstructions('Click second point to measure height difference');
        } else if (activeTool === 'height' && measurementPoints.length === 2) {
          measureHeight(measurementPoints);
        } else if (activeTool === 'point') {
          showCoordinates(position);
        }
      }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

      // Tool button handlers
      document.getElementById('distanceBtn').addEventListener('click', function() {
        setActiveTool('distance');
        updateInstructions('Click first point to start distance measurement');
      });

      document.getElementById('areaBtn').addEventListener('click', function() {
        setActiveTool('area');
        updateInstructions('Click first point to start area measurement (3 points required)');
      });

      document.getElementById('heightBtn').addEventListener('click', function() {
        setActiveTool('height');
        updateInstructions('Click first point to start height measurement');
      });

      document.getElementById('pointBtn').addEventListener('click', function() {
        setActiveTool('point');
        updateInstructions('Click on map to get coordinates');
      });

      document.getElementById('clearBtn').addEventListener('click', function() {
        // Clear all entities
        activeEntities.forEach(entity => viewer.entities.remove(entity));
        activeEntities = [];

        // Clear results
        document.getElementById('resultsList').innerHTML = '';

        // Reset state
        setActiveTool(null);
        measurementPoints = [];
        measurementCount = 0;

        updateInstructions('All measurements cleared. Select a tool to continue.');
      });

      // Load the survey data
      loadSurveyData();
    </script>
  </body>
</html>
