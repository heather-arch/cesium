<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cesium 3D Tileset Viewer</title>
  <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
  <link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Toolbar */
    .toolbar {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .tool-btn {
      width: 44px;
      height: 44px;
      background: rgba(48, 51, 54, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .tool-btn:hover {
      background: rgba(72, 75, 78, 0.95);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .tool-btn.active {
      background: #4a90d9;
      border-color: #6ba3e0;
    }

    .tool-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* Panels */
    .panel {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 320px;
      max-height: calc(100vh - 20px);
      background: rgba(38, 41, 44, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      color: #fff;
      z-index: 1000;
      display: none;
      overflow: hidden;
    }

    .panel.visible {
      display: block;
    }

    .panel-header {
      padding: 12px 15px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }

    .panel-close {
      background: none;
      border: none;
      color: #999;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }

    .panel-close:hover {
      color: #fff;
    }

    .panel-content {
      padding: 15px;
      max-height: 450px;
      overflow-y: auto;
    }

    /* Layers Panel */
    .layer-item {
      display: flex;
      align-items: center;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      margin-bottom: 8px;
    }

    .layer-item:last-child {
      margin-bottom: 0;
    }

    .layer-toggle {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      cursor: pointer;
    }

    .layer-name {
      flex: 1;
      font-size: 14px;
    }

    .layer-opacity {
      width: 50px;
      margin-left: 8px;
    }

    .layer-order-btns {
      display: flex;
      flex-direction: column;
      margin-left: 8px;
      gap: 2px;
    }

    .layer-order-btn {
      width: 20px;
      height: 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      color: #fff;
      cursor: pointer;
      font-size: 10px;
      line-height: 1;
      padding: 0;
    }

    .layer-order-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .layer-order-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Measure Panel */
    .measure-type {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .measure-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .measure-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .measure-btn.active {
      background: #4a90d9;
      border-color: #6ba3e0;
    }

    .measure-info {
      font-size: 12px;
      color: #999;
      margin-bottom: 10px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }

    .measure-result {
      padding: 12px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 4px;
      font-size: 14px;
      min-height: 60px;
    }

    .measure-result-label {
      color: #999;
      font-size: 12px;
      margin-bottom: 5px;
    }

    .measure-result-value {
      font-size: 18px;
      font-weight: 600;
      color: #4a90d9;
    }

    .clear-btn {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      background: rgba(220, 53, 69, 0.8);
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .clear-btn:hover {
      background: rgba(220, 53, 69, 1);
    }

    /* Draw Panel */
    .draw-type {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .draw-btn {
      flex: 1;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }

    .draw-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .draw-btn.active {
      background: #28a745;
      border-color: #34ce57;
    }

    .draw-info {
      font-size: 12px;
      color: #999;
      padding: 10px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      margin-bottom: 10px;
    }

    .shapes-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .shape-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .shape-delete {
      background: rgba(220, 53, 69, 0.6);
      border: none;
      color: #fff;
      padding: 4px 8px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
    }

    .shape-delete:hover {
      background: rgba(220, 53, 69, 1);
    }

    /* Project Features Panel */
    .feature-item {
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .feature-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .feature-name {
      font-weight: 500;
      margin-bottom: 4px;
    }

    .feature-coords {
      font-size: 12px;
      color: #999;
    }

    .add-feature-btn {
      width: 100%;
      padding: 12px;
      background: #4a90d9;
      border: none;
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .add-feature-btn:hover {
      background: #5a9de9;
    }

    /* View Controls */
    .view-presets {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 15px;
    }

    .view-preset-btn {
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .view-preset-btn:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    .slider-group {
      margin-bottom: 15px;
    }

    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .slider-input {
      width: 100%;
    }

    /* Info Box */
    .info-box {
      position: absolute;
      bottom: 40px;
      left: 10px;
      background: rgba(38, 41, 44, 0.9);
      padding: 10px 15px;
      border-radius: 4px;
      color: #fff;
      font-size: 12px;
      z-index: 1000;
    }

    .info-box span {
      margin-right: 15px;
    }

    /* Loading indicator */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
    }

    .loading-spinner {
      text-align: center;
      color: #fff;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: #4a90d9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Tooltip */
    .tool-tooltip {
      position: absolute;
      left: 55px;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .tool-btn:hover .tool-tooltip {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>

  <!-- Loading Overlay -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner">
      <div class="spinner"></div>
      <div>Loading 3D Tileset...</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <button class="tool-btn" id="layersBtn" title="Layers">
      <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      <span class="tool-tooltip">Layers</span>
    </button>
    <button class="tool-btn" id="drawBtn" title="Draw">
      <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
      <span class="tool-tooltip">Draw</span>
    </button>
    <button class="tool-btn" id="measureBtn" title="Measure">
      <svg viewBox="0 0 24 24"><path d="M21 6H3c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H3V8h2v4h2V8h2v4h2V8h2v4h2V8h2v4h2V8h2v8z"/></svg>
      <span class="tool-tooltip">Measure</span>
    </button>
    <button class="tool-btn" id="featuresBtn" title="Project Features">
      <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
      <span class="tool-tooltip">Features</span>
    </button>
    <button class="tool-btn" id="viewBtn" title="View Options">
      <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
      <span class="tool-tooltip">View</span>
    </button>
    <button class="tool-btn" id="homeBtn" title="Reset View">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span class="tool-tooltip">Home</span>
    </button>
  </div>

  <!-- Layers Panel -->
  <div class="panel" id="layersPanel">
    <div class="panel-header">
      <span>Layers</span>
      <button class="panel-close" onclick="closePanel('layersPanel')">&times;</button>
    </div>
    <div class="panel-content" id="layersContent">
      <!-- Layers will be dynamically populated -->
    </div>
  </div>

  <!-- Draw Panel -->
  <div class="panel" id="drawPanel">
    <div class="panel-header">
      <span>Draw on Terrain</span>
      <button class="panel-close" onclick="closePanel('drawPanel')">&times;</button>
    </div>
    <div class="panel-content">
      <div class="draw-type">
        <button class="draw-btn" id="drawLine">Line</button>
        <button class="draw-btn" id="drawPolygon">Polygon</button>
      </div>
      <div class="draw-info" id="drawInfo">
        Select a drawing mode above to begin.
      </div>
      <div class="shapes-list" id="shapesList"></div>
      <button class="clear-btn" id="clearShapes">Clear All Shapes</button>
    </div>
  </div>

  <!-- Measure Panel -->
  <div class="panel" id="measurePanel">
    <div class="panel-header">
      <span>Measure</span>
      <button class="panel-close" onclick="closePanel('measurePanel')">&times;</button>
    </div>
    <div class="panel-content">
      <div class="measure-type">
        <button class="measure-btn" id="measureDistance">Distance</button>
        <button class="measure-btn" id="measureArea">Area</button>
        <button class="measure-btn" id="measureHeight">Height</button>
      </div>
      <div class="measure-info" id="measureInfo">
        Left-click to add points. Right-click to finish.
      </div>
      <div class="measure-result">
        <div class="measure-result-label">Result</div>
        <div class="measure-result-value" id="measureValue">Select a mode to start</div>
      </div>
      <button class="clear-btn" id="clearMeasure">Clear Measurements</button>
    </div>
  </div>

  <!-- Features Panel -->
  <div class="panel" id="featuresPanel">
    <div class="panel-header">
      <span>Project Features</span>
      <button class="panel-close" onclick="closePanel('featuresPanel')">&times;</button>
    </div>
    <div class="panel-content">
      <button class="add-feature-btn" id="addFeatureBtn">+ Add Feature (Click on Map)</button>
      <div id="featuresList"></div>
    </div>
  </div>

  <!-- View Panel -->
  <div class="panel" id="viewPanel">
    <div class="panel-header">
      <span>View Options</span>
      <button class="panel-close" onclick="closePanel('viewPanel')">&times;</button>
    </div>
    <div class="panel-content">
      <div class="view-presets">
        <button class="view-preset-btn" onclick="setViewPreset('top')">Top Down</button>
        <button class="view-preset-btn" onclick="setViewPreset('north')">North</button>
        <button class="view-preset-btn" onclick="setViewPreset('south')">South</button>
        <button class="view-preset-btn" onclick="setViewPreset('east')">East</button>
        <button class="view-preset-btn" onclick="setViewPreset('west')">West</button>
        <button class="view-preset-btn" onclick="setViewPreset('perspective')">Perspective</button>
      </div>
      <div class="slider-group">
        <div class="slider-label">
          <span>Field of View</span>
          <span id="fovValue">60°</span>
        </div>
        <input type="range" class="slider-input" id="fovSlider" min="10" max="120" value="60" />
      </div>
      <div class="slider-group">
        <div class="slider-label">
          <span>Screen Space Error</span>
          <span id="sseValue">16</span>
        </div>
        <input type="range" class="slider-input" id="sseSlider" min="1" max="64" value="16" />
      </div>
    </div>
  </div>

  <!-- Info Box -->
  <div class="info-box" id="infoBox">
    <span>Lat: <span id="latValue">--</span></span>
    <span>Lon: <span id="lonValue">--</span></span>
    <span>Height: <span id="heightValue">--</span></span>
  </div>

  <script>
    // Cesium Ion access token
    Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiI2NDQwZmY1Ny05OWFlLTQ4ZTgtYWFjNS0yZWY4YzYyZTM1ZmIiLCJpZCI6MzU3ODExLCJpYXQiOjE3NjI0MjkxNjB9.OxogfbQax9huxXihwGkJ9GemU8rj2M4WhUweWguwS-Y';

    // Initialize viewer
    const viewer = new Cesium.Viewer('cesiumContainer', {
      terrain: Cesium.Terrain.fromWorldTerrain(),
      animation: false,
      timeline: false,
      baseLayerPicker: false,
      fullscreenButton: true,
      vrButton: false,
      geocoder: true,
      homeButton: false,
      infoBox: true,
      sceneModePicker: true,
      selectionIndicator: false,
      navigationHelpButton: false,
      navigationInstructionsInitiallyVisible: false,
    });

    // Disable default double-click behavior
    viewer.cesiumWidget.screenSpaceEventHandler.removeInputAction(
      Cesium.ScreenSpaceEventType.LEFT_DOUBLE_CLICK
    );

    // ==================== LAYER MANAGEMENT ====================
    const layers = [];
    let tileset = null;
    let ionImageryLayer = null;

    function createLayerItem(layer) {
      const div = document.createElement('div');
      div.className = 'layer-item';
      div.dataset.layerId = layer.id;

      const index = layers.indexOf(layer);
      const canRaise = index > 0;
      const canLower = index < layers.length - 1;

      div.innerHTML = `
        <input type="checkbox" class="layer-toggle" ${layer.show ? 'checked' : ''} />
        <span class="layer-name">${layer.name}</span>
        ${layer.hasOpacity ? `<input type="range" class="layer-opacity" min="0" max="100" value="${Math.round(layer.alpha * 100)}" />` : ''}
        ${layer.canReorder ? `
        <div class="layer-order-btns">
          <button class="layer-order-btn" ${!canRaise ? 'disabled' : ''} data-action="raise">▲</button>
          <button class="layer-order-btn" ${!canLower ? 'disabled' : ''} data-action="lower">▼</button>
        </div>` : ''}
      `;

      // Toggle visibility
      div.querySelector('.layer-toggle').onchange = (e) => {
        layer.show = e.target.checked;
        if (layer.target) layer.target.show = e.target.checked;
      };

      // Opacity slider
      const opacitySlider = div.querySelector('.layer-opacity');
      if (opacitySlider) {
        opacitySlider.oninput = (e) => {
          layer.alpha = e.target.value / 100;
          if (layer.target && layer.target.alpha !== undefined) {
            layer.target.alpha = layer.alpha;
          } else if (layer.target && layer.target.style !== undefined) {
            layer.target.style = new Cesium.Cesium3DTileStyle({
              color: `color('white', ${layer.alpha})`
            });
          }
        };
      }

      // Reorder buttons
      div.querySelectorAll('.layer-order-btn').forEach(btn => {
        btn.onclick = () => {
          const action = btn.dataset.action;
          const idx = layers.indexOf(layer);
          if (action === 'raise' && idx > 0) {
            [layers[idx], layers[idx - 1]] = [layers[idx - 1], layers[idx]];
            if (layer.imageryLayer) {
              viewer.imageryLayers.raise(layer.imageryLayer);
            }
          } else if (action === 'lower' && idx < layers.length - 1) {
            [layers[idx], layers[idx + 1]] = [layers[idx + 1], layers[idx]];
            if (layer.imageryLayer) {
              viewer.imageryLayers.lower(layer.imageryLayer);
            }
          }
          updateLayersPanel();
        };
      });

      return div;
    }

    function updateLayersPanel() {
      const content = document.getElementById('layersContent');
      content.innerHTML = '';
      layers.forEach(layer => {
        content.appendChild(createLayerItem(layer));
      });
    }

    function addLayer(config) {
      const layer = {
        id: config.id || 'layer_' + Date.now(),
        name: config.name,
        show: config.show !== undefined ? config.show : true,
        alpha: config.alpha !== undefined ? config.alpha : 1,
        hasOpacity: config.hasOpacity !== undefined ? config.hasOpacity : true,
        canReorder: config.canReorder !== undefined ? config.canReorder : false,
        target: config.target,
        imageryLayer: config.imageryLayer
      };
      layers.push(layer);
      updateLayersPanel();
      return layer;
    }

    // ==================== DRAWING TOOL (Official Cesium Pattern) ====================
    let drawingMode = null;
    let activeShapePoints = [];
    let activeShape = null;
    let floatingPoint = null;
    let drawnShapes = [];
    let shapeCounter = 1;

    function createPoint(worldPosition) {
      return viewer.entities.add({
        position: worldPosition,
        point: {
          color: Cesium.Color.WHITE,
          pixelSize: 8,
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 1
        }
      });
    }

    function drawShape(positionData) {
      let shape;
      if (drawingMode === 'line') {
        shape = viewer.entities.add({
          polyline: {
            positions: positionData,
            clampToGround: true,
            width: 3,
            material: Cesium.Color.YELLOW
          }
        });
      } else if (drawingMode === 'polygon') {
        shape = viewer.entities.add({
          polygon: {
            hierarchy: positionData,
            material: Cesium.Color.YELLOW.withAlpha(0.4),
            outline: true,
            outlineColor: Cesium.Color.YELLOW,
            heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
          }
        });
      }
      return shape;
    }

    function terminateShape() {
      if (activeShapePoints.length < 2) {
        // Not enough points
        if (floatingPoint) viewer.entities.remove(floatingPoint);
        if (activeShape) viewer.entities.remove(activeShape);
        floatingPoint = undefined;
        activeShape = undefined;
        activeShapePoints = [];
        return;
      }

      activeShapePoints.pop(); // Remove floating point position

      const finalShape = drawShape(activeShapePoints);
      const shapeInfo = {
        id: 'shape_' + Date.now(),
        name: (drawingMode === 'line' ? 'Line ' : 'Polygon ') + shapeCounter++,
        type: drawingMode,
        entity: finalShape,
        points: [...activeShapePoints]
      };
      drawnShapes.push(shapeInfo);

      viewer.entities.remove(floatingPoint);
      viewer.entities.remove(activeShape);
      floatingPoint = undefined;
      activeShape = undefined;
      activeShapePoints = [];

      updateShapesList();
    }

    function setDrawingMode(mode) {
      // Clear any in-progress drawing
      if (activeShape) terminateShape();

      measureMode = null;
      featureMode = false;
      document.querySelectorAll('.measure-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.draw-btn').forEach(btn => btn.classList.remove('active'));

      if (drawingMode === mode) {
        drawingMode = null;
        document.getElementById('drawInfo').textContent = 'Select a drawing mode above to begin.';
      } else {
        drawingMode = mode;
        document.getElementById('draw' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
        document.getElementById('drawInfo').textContent = 'Left-click to add vertices. Right-click to finish shape.';
      }
    }

    function updateShapesList() {
      const list = document.getElementById('shapesList');
      list.innerHTML = drawnShapes.map(s => `
        <div class="shape-item">
          <span>${s.name} (${s.points.length} pts)</span>
          <button class="shape-delete" onclick="deleteShape('${s.id}')">Delete</button>
        </div>
      `).join('');
    }

    window.deleteShape = function(id) {
      const idx = drawnShapes.findIndex(s => s.id === id);
      if (idx >= 0) {
        viewer.entities.remove(drawnShapes[idx].entity);
        drawnShapes.splice(idx, 1);
        updateShapesList();
      }
    };

    document.getElementById('drawLine').onclick = () => setDrawingMode('line');
    document.getElementById('drawPolygon').onclick = () => setDrawingMode('polygon');
    document.getElementById('clearShapes').onclick = () => {
      drawnShapes.forEach(s => viewer.entities.remove(s.entity));
      drawnShapes = [];
      shapeCounter = 1;
      updateShapesList();
    };

    // ==================== MEASUREMENT TOOL ====================
    let measureMode = null;
    let measurePoints = [];
    let measureEntities = [];
    let activeMeasureShape = null;

    function setMeasureMode(mode) {
      clearMeasurements();
      drawingMode = null;
      featureMode = false;
      document.querySelectorAll('.draw-btn').forEach(btn => btn.classList.remove('active'));

      measureMode = mode;
      document.querySelectorAll('.measure-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('measure' + mode.charAt(0).toUpperCase() + mode.slice(1)).classList.add('active');
      document.getElementById('measureValue').textContent = 'Click points on the map';
      document.getElementById('measureInfo').textContent = 'Left-click to add points. Right-click to finish.';
    }

    function clearMeasurements() {
      measurePoints = [];
      measureEntities.forEach(entity => viewer.entities.remove(entity));
      measureEntities = [];
      if (activeMeasureShape) {
        viewer.entities.remove(activeMeasureShape);
        activeMeasureShape = null;
      }
      measureMode = null;
      document.querySelectorAll('.measure-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('measureValue').textContent = 'Select a mode to start';
    }

    function addMeasurePoint(cartesian) {
      measurePoints.push(cartesian);

      // Add point with terrain clamping
      const point = viewer.entities.add({
        position: cartesian,
        point: {
          pixelSize: 10,
          color: Cesium.Color.CYAN,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 2,
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
        }
      });
      measureEntities.push(point);

      // Update live line/polygon
      if (measurePoints.length > 1) {
        if (activeMeasureShape) {
          viewer.entities.remove(activeMeasureShape);
        }

        if (measureMode === 'area' && measurePoints.length >= 3) {
          activeMeasureShape = viewer.entities.add({
            polygon: {
              hierarchy: new Cesium.CallbackProperty(() => new Cesium.PolygonHierarchy(measurePoints), false),
              material: Cesium.Color.CYAN.withAlpha(0.3),
              outline: true,
              outlineColor: Cesium.Color.CYAN,
              heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
            }
          });
        } else {
          activeMeasureShape = viewer.entities.add({
            polyline: {
              positions: new Cesium.CallbackProperty(() => measurePoints, false),
              clampToGround: true,
              width: 3,
              material: Cesium.Color.CYAN
            }
          });
        }
        measureEntities.push(activeMeasureShape);
      }

      // Calculate and display results
      if (measureMode === 'distance' && measurePoints.length >= 2) {
        calculateDistance();
      } else if (measureMode === 'area' && measurePoints.length >= 3) {
        calculateArea();
      } else if (measureMode === 'height' && measurePoints.length >= 2) {
        calculateHeight();
      }
    }

    function finishMeasurement() {
      if (measureMode === 'distance' && measurePoints.length >= 2) {
        calculateDistance();
      } else if (measureMode === 'area' && measurePoints.length >= 3) {
        calculateArea();
      } else if (measureMode === 'height' && measurePoints.length >= 2) {
        calculateHeight();
      }
      document.getElementById('measureInfo').textContent = 'Measurement complete. Click Clear to start over.';
    }

    function calculateDistance() {
      let totalDistance = 0;
      for (let i = 0; i < measurePoints.length - 1; i++) {
        const start = Cesium.Cartographic.fromCartesian(measurePoints[i]);
        const end = Cesium.Cartographic.fromCartesian(measurePoints[i + 1]);
        const geodesic = new Cesium.EllipsoidGeodesic(start, end);
        totalDistance += geodesic.surfaceDistance;
      }

      let displayValue;
      if (totalDistance > 1000) {
        displayValue = (totalDistance / 1000).toFixed(2) + ' km';
      } else {
        displayValue = totalDistance.toFixed(2) + ' m';
      }
      document.getElementById('measureValue').textContent = displayValue;
    }

    function calculateArea() {
      // Use Cesium's built-in polygon area calculation
      const positions = measurePoints.map(p => Cesium.Cartographic.fromCartesian(p));

      // Shoelace formula with proper geodetic consideration
      let area = 0;
      const n = positions.length;
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        const xi = positions[i].longitude;
        const yi = positions[i].latitude;
        const xj = positions[j].longitude;
        const yj = positions[j].latitude;
        area += xi * yj - xj * yi;
      }

      // Convert to square meters (approximate at the equator)
      const avgLat = positions.reduce((sum, p) => sum + p.latitude, 0) / n;
      const metersPerDegree = 111320 * Math.cos(avgLat);
      area = Math.abs(area / 2) * metersPerDegree * metersPerDegree;

      let displayValue;
      if (area > 1000000) {
        displayValue = (area / 1000000).toFixed(4) + ' km²';
      } else if (area > 10000) {
        displayValue = (area / 10000).toFixed(4) + ' hectares';
      } else {
        displayValue = area.toFixed(2) + ' m²';
      }
      document.getElementById('measureValue').textContent = displayValue;
    }

    function calculateHeight() {
      const start = Cesium.Cartographic.fromCartesian(measurePoints[0]);
      const end = Cesium.Cartographic.fromCartesian(measurePoints[measurePoints.length - 1]);
      const heightDiff = end.height - start.height;
      const sign = heightDiff >= 0 ? '+' : '';
      document.getElementById('measureValue').textContent = sign + heightDiff.toFixed(2) + ' m';
    }

    document.getElementById('measureDistance').onclick = () => setMeasureMode('distance');
    document.getElementById('measureArea').onclick = () => setMeasureMode('area');
    document.getElementById('measureHeight').onclick = () => setMeasureMode('height');
    document.getElementById('clearMeasure').onclick = clearMeasurements;

    // ==================== FEATURE MANAGEMENT ====================
    let featureMode = false;
    let features = [];
    let featureCounter = 1;

    document.getElementById('addFeatureBtn').onclick = () => {
      featureMode = !featureMode;
      measureMode = null;
      drawingMode = null;
      document.querySelectorAll('.measure-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.draw-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById('addFeatureBtn').textContent = featureMode ? 'Click on Map to Place' : '+ Add Feature (Click on Map)';
      document.getElementById('addFeatureBtn').style.background = featureMode ? '#28a745' : '#4a90d9';
    };

    function addFeature(cartesian) {
      const cartographic = Cesium.Cartographic.fromCartesian(cartesian);
      const lat = Cesium.Math.toDegrees(cartographic.latitude).toFixed(6);
      const lon = Cesium.Math.toDegrees(cartographic.longitude).toFixed(6);

      const feature = {
        id: 'feature_' + Date.now(),
        name: 'Feature ' + featureCounter++,
        position: cartesian,
        lat: lat,
        lon: lon
      };

      features.push(feature);

      viewer.entities.add({
        id: feature.id,
        position: cartesian,
        point: {
          pixelSize: 12,
          color: Cesium.Color.RED,
          outlineColor: Cesium.Color.WHITE,
          outlineWidth: 2,
          heightReference: Cesium.HeightReference.CLAMP_TO_GROUND
        },
        label: {
          text: feature.name,
          font: '14px sans-serif',
          verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
          pixelOffset: new Cesium.Cartesian2(0, -15),
          fillColor: Cesium.Color.WHITE,
          outlineColor: Cesium.Color.BLACK,
          outlineWidth: 2,
          style: Cesium.LabelStyle.FILL_AND_OUTLINE
        }
      });

      updateFeaturesList();
      featureMode = false;
      document.getElementById('addFeatureBtn').textContent = '+ Add Feature (Click on Map)';
      document.getElementById('addFeatureBtn').style.background = '#4a90d9';
    }

    function updateFeaturesList() {
      const list = document.getElementById('featuresList');
      list.innerHTML = features.map(f => `
        <div class="feature-item" onclick="flyToFeature('${f.id}')">
          <div class="feature-name">${f.name}</div>
          <div class="feature-coords">Lat: ${f.lat}, Lon: ${f.lon}</div>
        </div>
      `).join('');
    }

    window.flyToFeature = function(id) {
      const feature = features.find(f => f.id === id);
      if (feature) {
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(
            parseFloat(feature.lon),
            parseFloat(feature.lat),
            500
          )
        });
      }
    };

    // ==================== VIEW CONTROLS ====================
    window.setViewPreset = function(preset) {
      if (!tileset) return;

      const boundingSphere = tileset.boundingSphere;
      const radius = boundingSphere.radius;

      let heading = 0, pitch = -45, distance = radius * 2;

      switch (preset) {
        case 'top': pitch = -90; break;
        case 'north': heading = 0; pitch = -30; break;
        case 'south': heading = 180; pitch = -30; break;
        case 'east': heading = 90; pitch = -30; break;
        case 'west': heading = -90; pitch = -30; break;
        case 'perspective': heading = 45; pitch = -30; break;
      }

      viewer.camera.flyToBoundingSphere(boundingSphere, {
        offset: new Cesium.HeadingPitchRange(
          Cesium.Math.toRadians(heading),
          Cesium.Math.toRadians(pitch),
          distance
        )
      });
    };

    document.getElementById('fovSlider').oninput = (e) => {
      const fov = parseInt(e.target.value);
      viewer.camera.frustum.fov = Cesium.Math.toRadians(fov);
      document.getElementById('fovValue').textContent = fov + '°';
    };

    document.getElementById('sseSlider').oninput = (e) => {
      const sse = parseInt(e.target.value);
      if (tileset) tileset.maximumScreenSpaceError = sse;
      document.getElementById('sseValue').textContent = sse;
    };

    // ==================== PANEL MANAGEMENT ====================
    function closePanel(panelId) {
      document.getElementById(panelId).classList.remove('visible');
      document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
    }

    function togglePanel(panelId, btnId) {
      const panel = document.getElementById(panelId);
      const btn = document.getElementById(btnId);
      const isVisible = panel.classList.contains('visible');

      document.querySelectorAll('.panel').forEach(p => p.classList.remove('visible'));
      document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));

      if (!isVisible) {
        panel.classList.add('visible');
        btn.classList.add('active');
      }
    }

    document.getElementById('layersBtn').onclick = () => togglePanel('layersPanel', 'layersBtn');
    document.getElementById('drawBtn').onclick = () => togglePanel('drawPanel', 'drawBtn');
    document.getElementById('measureBtn').onclick = () => togglePanel('measurePanel', 'measureBtn');
    document.getElementById('featuresBtn').onclick = () => togglePanel('featuresPanel', 'featuresBtn');
    document.getElementById('viewBtn').onclick = () => togglePanel('viewPanel', 'viewBtn');
    document.getElementById('homeBtn').onclick = () => {
      if (tileset) viewer.zoomTo(tileset);
    };

    // ==================== EVENT HANDLERS ====================
    const handler = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);

    // Left click - add points
    handler.setInputAction((event) => {
      const ray = viewer.camera.getPickRay(event.position);
      const earthPosition = viewer.scene.globe.pick(ray, viewer.scene);

      if (Cesium.defined(earthPosition)) {
        if (drawingMode) {
          // Drawing mode (official Cesium pattern)
          if (activeShapePoints.length === 0) {
            floatingPoint = createPoint(earthPosition);
            activeShapePoints.push(earthPosition);
            const dynamicPositions = new Cesium.CallbackProperty(() => {
              if (drawingMode === 'polygon') {
                return new Cesium.PolygonHierarchy(activeShapePoints);
              }
              return activeShapePoints;
            }, false);
            activeShape = drawShape(dynamicPositions);
          }
          activeShapePoints.push(earthPosition);
          createPoint(earthPosition);
        } else if (measureMode) {
          addMeasurePoint(earthPosition);
        } else if (featureMode) {
          addFeature(earthPosition);
        }
      }
    }, Cesium.ScreenSpaceEventType.LEFT_CLICK);

    // Mouse move - update floating point
    handler.setInputAction((event) => {
      const ray = viewer.camera.getPickRay(event.endPosition);
      const newPosition = viewer.scene.globe.pick(ray, viewer.scene);

      if (Cesium.defined(newPosition)) {
        // Update coordinate display
        const cartographic = Cesium.Cartographic.fromCartesian(newPosition);
        document.getElementById('latValue').textContent = Cesium.Math.toDegrees(cartographic.latitude).toFixed(6);
        document.getElementById('lonValue').textContent = Cesium.Math.toDegrees(cartographic.longitude).toFixed(6);
        document.getElementById('heightValue').textContent = cartographic.height.toFixed(1) + 'm';

        // Update floating point for drawing
        if (Cesium.defined(floatingPoint)) {
          floatingPoint.position.setValue(newPosition);
          activeShapePoints.pop();
          activeShapePoints.push(newPosition);
        }
      }
    }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);

    // Right click - finish drawing/measuring
    handler.setInputAction((event) => {
      if (drawingMode) {
        terminateShape();
      } else if (measureMode) {
        finishMeasurement();
      }
    }, Cesium.ScreenSpaceEventType.RIGHT_CLICK);

    // ==================== LOAD ASSETS ====================
    async function loadAssets() {
      try {
        console.log('Using token:', Cesium.Ion.defaultAccessToken.substring(0, 50) + '...');

        // Add base layer to layer manager
        addLayer({
          id: 'base_imagery',
          name: 'Base Imagery',
          target: viewer.scene.imageryLayers.get(0),
          imageryLayer: viewer.scene.imageryLayers.get(0),
          hasOpacity: true,
          canReorder: true
        });

        // Load imagery layer (Asset ID: 4115848)
        console.log('Loading imagery layer with Asset ID: 4115848');
        const imageryProvider = await Cesium.IonImageryProvider.fromAssetId(4115848);
        ionImageryLayer = viewer.imageryLayers.addImageryProvider(imageryProvider);
        addLayer({
          id: 'ion_imagery',
          name: 'Ion Imagery (4115848)',
          target: ionImageryLayer,
          imageryLayer: ionImageryLayer,
          hasOpacity: true,
          canReorder: true
        });
        console.log('Imagery layer loaded successfully');

        // Load 3D Tileset (Asset ID: 4019912)
        console.log('Loading 3D tileset with Asset ID: 4019912');
        tileset = await Cesium.Cesium3DTileset.fromIonAssetId(4019912);
        viewer.scene.primitives.add(tileset);
        addLayer({
          id: '3d_tileset',
          name: '3D Tileset (4019912)',
          target: tileset,
          hasOpacity: true,
          canReorder: false
        });
        console.log('3D Tileset loaded successfully');

        // Add terrain and atmosphere layers
        addLayer({
          id: 'terrain',
          name: 'Terrain',
          target: viewer.scene.globe,
          hasOpacity: false,
          canReorder: false
        });

        addLayer({
          id: 'atmosphere',
          name: 'Atmosphere',
          target: viewer.scene.skyAtmosphere,
          hasOpacity: false,
          canReorder: false
        });

        // Zoom to tileset
        await viewer.zoomTo(tileset);

        // Hide loading overlay
        document.getElementById('loadingOverlay').style.display = 'none';

      } catch (error) {
        console.error('Full error object:', error);
        console.error('Error loading assets:', error.message || error);

        let errorMsg = 'Unknown error';
        if (error.message) {
          errorMsg = error.message;
        } else if (error.statusCode) {
          errorMsg = 'HTTP ' + error.statusCode + ': Access denied or asset not found';
        } else if (typeof error === 'string') {
          errorMsg = error;
        }

        document.getElementById('loadingOverlay').innerHTML =
          '<div class="loading-spinner">' +
          '<div style="color: #ff6b6b; font-size: 18px; margin-bottom: 15px;">Error loading assets</div>' +
          '<div style="font-size: 13px; color: #ccc; max-width: 400px; line-height: 1.5;">' + errorMsg + '</div>' +
          '<div style="font-size: 12px; color: #999; margin-top: 15px;">Check browser console (F12) for details.<br>Verify your Ion access token and asset IDs are correct.</div>' +
          '</div>';
      }
    }

    loadAssets();
  </script>
</body>
</html>
